# Pattern 1 from the README: the retry loop.
#
# This agent hits a dependency it cannot reach and retries the same task
# forever. Every individual attempt is cheap and nothing exceeds a per-call
# limit, so a budget cap never fires — but it burns CPU indefinitely and
# completes nothing. The retry is genuine: it really does try to reach a host
# that does not resolve, and really does fail.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retry-loop-agent
  namespace: autophagy
  labels:
    app: retry-loop-agent
    autophagy.io/role: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: retry-loop-agent
  template:
    metadata:
      labels:
        app: retry-loop-agent
        autophagy.io/role: agent
      annotations:
        autophagy.io/agent-wallet: "0x4b3B596588a8703e2B820491a240b260B559f050"
        autophagy.io/agent-uri: "autophagy://agent/retry-loop-agent"
    spec:
      containers:
        - name: agent
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              TASK="settlement-reconcile-4417"
              while true; do
                echo "AUTOPHAGY attempt task=$TASK"
                # A real failing dependency: this host does not exist.
                wget -q -T 3 -O /dev/null http://payments-api.invalid/settle 2>/dev/null \
                  && echo "AUTOPHAGY complete task=$TASK" \
                  || echo "attempt failed, backing off before retry"
                # Retry work between attempts — this is the cost nobody sees.
                i=0
                while [ $i -lt 250000 ]; do i=$((i + 1)); done
                sleep 2
              done
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
