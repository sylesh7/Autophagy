# Pattern 3 from the README: the forgotten standby.
#
# Provisioned for a burst of work that ended. Nobody tore it down. It holds
# 250m CPU and 256Mi of memory, reports no task activity at all, and carries no
# annotation explaining why it exists. Technically "idle" rather than "in use",
# and indistinguishable from legitimate reserved capacity to anything that only
# looks at spend.
#
# Contrast with 05-standby-agent.yaml, which is equally idle but declares its
# intent — the pair is what separates behavioral reasoning from a threshold.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dead-allocation-agent
  namespace: autophagy
  labels:
    app: dead-allocation-agent
    autophagy.io/role: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dead-allocation-agent
  template:
    metadata:
      labels:
        app: dead-allocation-agent
        autophagy.io/role: agent
      annotations:
        autophagy.io/agent-wallet: "0xaeCd41785cfDDb16983cB61B8EC71f706E7782a7"
        autophagy.io/agent-uri: "autophagy://agent/dead-allocation-agent"
    spec:
      containers:
        - name: agent
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Holds its allocation and does nothing. No AUTOPHAGY activity
              # lines are ever emitted, because no work is ever attempted.
              echo "agent-runtime v1.4.2 ready, awaiting dispatch"
              while true; do sleep 3600; done
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
